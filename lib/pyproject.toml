[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "timotion-ble"
version = "0.1.8"
description = "Control TiMOTION standing desks with a built-in BLE module (TC15S)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Riccardo Caselli" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Framework :: AsyncIO",
    "Topic :: Home Automation",
]
dependencies = [
    "bleak>=0.22",
    "bleak-retry-connector>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
timotion-ble = "timotion_ble.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/timotion_ble"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
